name: build

on:
  push:
    branches: [main, harden]
  pull_request:
    branches: [main, harden]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [Release, RelWithAsan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"
          cmake --version

      - name: Configure (${{ matrix.preset }})
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Tests under ASan
        if: matrix.preset == 'RelWithAsan'
        shell: pwsh
        run: ctest --preset RelWithAsan --output-on-failure

      - name: Whitelist gate (non-strict)
        if: matrix.preset == 'Release'
        shell: pwsh
        run: ./tools/check-release-whitelist.ps1

      - name: Upload built DLL
        if: matrix.preset == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ds2_seamless_coop-dll
          path: build/Release/bin/Release/ds2_seamless_coop.dll
          if-no-files-found: error
